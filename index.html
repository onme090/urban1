<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Starter Template</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
        }
        header {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 20px 0;
            text-align: center;
        }
        main {
            padding: 40px 20px;
            text-align: center;
            min-height: 60vh;
        }
        footer {
            background-color: #2c3e50;
            color: #ffffff;
            text-align: center;
            padding: 15px 0;
            position: absolute;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

<header>
    <h1>UrbanVibe</h1>
</header>

<main>
    <h2>Робоча зона</h2>
    <p>Початок роботи.</p>
</main>

<footer>
    <p>&copy; 2026 Шаблон.</p>
</footer>

</body>
</html>
